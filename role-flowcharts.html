      --ink-muted: #a3a9b2;
      --border: #3a3d42;

      --decision-fill: #352c1c; --decision-border: #5c4a26;

    --surface: #242629;

  .sheet { max-width: 1100px; margin: 0 auto; }

  .doc-title {

  .doc-sub {

<div class="sheet">
  <h1 class="doc-title">Login and Role Flowcharts</h1>
  <p class="doc-sub">The real authentication flow, followed by each of SafeSpace's eight roles' primary operating flow.</p>

  <div id="figures"></div>
</div>

<script>
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs = {}, text) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  };

  function wrapLines(text, maxChars) {
    if (text.includes('\n')) return text.split('\n');
    const words = text.split(' ');
    const lines = [];
    let line = '';
    words.forEach((w) => {
      const test = line ? line + ' ' + w : w;
      if (test.length > maxChars) { lines.push(line); line = w; } else { line = test; }
    });
    lines.push(line);
    return lines;
  }

  function arrowheadAt(svg, x, y, ux, uy) {
    const size = 8;
    const leftX = x - ux * size - uy * size * 0.55, leftY = y - uy * size + ux * size * 0.55;
    const rightX = x - ux * size + uy * size * 0.55, rightY = y - uy * size - ux * size * 0.55;
    svg.appendChild(el('polygon', { points: `${x},${y} ${leftX},${leftY} ${rightX},${rightY}`, fill: 'var(--ink-muted)', opacity: 0.7 }));
  }

  const COL_W = 182, ROW_H = 104;
  const PROC_W = 152, PROC_H = 52;
  const DEC_W = 158, DEC_H = 78;
  const OVAL_W = 140, OVAL_H = 44;

  function renderFlowchart(svg, nodes, edges) {
    const nodeMap = {};
    nodes.forEach((n) => (nodeMap[n.id] = n));
    let minCol = 0, maxCol = 0, maxRow = 0;
    nodes.forEach((n) => {
      minCol = Math.min(minCol, n.col);
      maxCol = Math.max(maxCol, n.col);
      maxRow = Math.max(maxRow, n.row);
    });
    const padX = 110, padY = 60;
    const width = (maxCol - minCol) * COL_W + padX * 2;
    const height = maxRow * ROW_H + padY * 2;
    const offsetX = padX - minCol * COL_W;
    const offsetY = padY;
    svg.setAttribute('viewBox', `0 0 ${width} ${height}`);

    function pt(n) {
      return { x: n.col * COL_W + offsetX, y: n.row * ROW_H + offsetY };
    }

    edges.forEach((e) => {
      const a = nodeMap[e.from], b = nodeMap[e.to];
      const pa = pt(a), pb = pt(b);
      const pts = e.via ? [pa, ...e.via.map((v) => ({ x: v.col * COL_W + offsetX, y: v.row * ROW_H + offsetY })), pb] : [pa, pb];
      const d = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p.x + ',' + p.y).join(' ');
      svg.appendChild(el('path', { d, fill: 'none', stroke: 'var(--ink-muted)', 'stroke-width': 1.4, opacity: 0.55 }));
      const last = pts[pts.length - 1], prev = pts[pts.length - 2];
      const dx = last.x - prev.x, dy = last.y - prev.y, len = Math.hypot(dx, dy) || 1;
      const ux = dx / len, uy = dy / len;
      const pullback = b.type === 'decision' ? 34 : b.type === 'start' || b.type === 'end' ? 24 : 28;
      arrowheadAt(svg, last.x - ux * pullback, last.y - uy * pullback, ux, uy);
      if (e.label) {
        const mid = pts.length === 2 ? { x: (pa.x + pb.x) / 2, y: (pa.y + pb.y) / 2 } : pts[1];
        svg.appendChild(el('rect', { x: mid.x - 14, y: mid.y - 9, width: 28, height: 16, fill: 'var(--surface)' }));
        svg.appendChild(el('text', { x: mid.x, y: mid.y + 3, 'text-anchor': 'middle', class: 'edge-label' }, e.label));
      }
    });

    nodes.forEach((n) => {
      const p = pt(n);
      const g = el('g');
      if (n.type === 'start' || n.type === 'end') {
        g.appendChild(el('ellipse', { cx: p.x, cy: p.y, rx: OVAL_W / 2, ry: OVAL_H / 2, fill: 'var(--accent-soft)', stroke: 'var(--accent)', 'stroke-width': 1.5 }));
        const lines = wrapLines(n.label, 16);
        const sy = p.y - (lines.length - 1) * 6.5;
        lines.forEach((ln, i) => g.appendChild(el('text', { x: p.x, y: sy + i * 13, 'text-anchor': 'middle', class: 'node-label' }, ln)));
      } else if (n.type === 'decision') {
        const hw = DEC_W / 2, hh = DEC_H / 2;
        g.appendChild(el('polygon', { points: `${p.x},${p.y - hh} ${p.x + hw},${p.y} ${p.x},${p.y + hh} ${p.x - hw},${p.y}`, fill: 'var(--decision-fill)', stroke: 'var(--decision-border)', 'stroke-width': 1.5 }));
        const lines = wrapLines(n.label, 13);
        const sy = p.y - (lines.length - 1) * 6.5;
        lines.forEach((ln, i) => g.appendChild(el('text', { x: p.x, y: sy + i * 13, 'text-anchor': 'middle', class: 'node-label' }, ln)));
      } else {
        g.appendChild(el('rect', { x: p.x - PROC_W / 2, y: p.y - PROC_H / 2, width: PROC_W, height: PROC_H, rx: 8, fill: 'var(--surface)', stroke: 'var(--border)', 'stroke-width': 1.5 }));
        const lines = wrapLines(n.label, 17);
        const sy = p.y - (lines.length - 1) * 6.5;
        lines.forEach((ln, i) => g.appendChild(el('text', { x: p.x, y: sy + i * 13, 'text-anchor': 'middle', class: 'node-label' }, ln)));
      }
      svg.appendChild(g);
    });
  }

  const container = document.getElementById('figures');
  FLOWCHARTS.forEach((fc, idx) => {
    const block = document.createElement('div');
    block.className = 'fig-block';
    block.innerHTML = `
      <p class="eyebrow">System Design</p>
      <p class="fig-title">${fc.title}</p>
      <div class="diagram-scroll"><svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${fc.title}"></svg></div>
      <p class="caption">${fc.title}</p>
    `;
    container.appendChild(block);
    const svg = block.querySelector('svg');
    renderFlowchart(svg, fc.nodes, fc.edges);
    if (idx < FLOWCHARTS.length - 1) {
      const hr = document.createElement('hr');
      hr.className = 'divider';

</script>
